name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 90
    environment: app-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source
        run: |
          go test ./... -count=1
          ./scripts/test-shared-swift.sh

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/distribution.p12"
          keychain_path="$RUNNER_TEMP/taphaptic-signing.keychain-db"
          profile_path="$RUNNER_TEMP/taphaptic.mobileprovision"
          profile_install_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$profile_path"
          mkdir -p "$profile_install_dir"
          cp "$profile_path" "$profile_install_dir/2a1d66de-8871-4c11-9e4b-739641bd24fa.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Prepare App Store Connect key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          printf 'ASC_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TAPHAPTIC_API_BASE_URL: ${{ secrets.TAPHAPTIC_API_BASE_URL }}
          CURRENT_PROJECT_VERSION: ${{ inputs.build_number }}
          TAPHAPTIC_CODE_SIGN_IDENTITY: Apple Distribution
          TAPHAPTIC_PROVISIONING_PROFILE_SPECIFIER: Taphaptic App Store 1.0
        run: ./scripts/archive-watch-app.sh

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ./scripts/upload-testflight.sh
